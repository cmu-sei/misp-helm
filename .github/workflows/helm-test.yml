name: Lint and Test Charts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup base software
        uses: ./.github/actions/setup

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing for misp (lint)
        run: ct lint --charts ./

  helm-unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup base software
        uses: ./.github/actions/setup

      - name: Setup helm unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.0.2

      - name: Run helm unittest
        run: helm unittest ./

  checkov-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup base software
        uses: ./.github/actions/setup

      - name: Fetch chart dependencies
        run: helm dependency update ./

      - name: Run Checkov action
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: helm
          output_format: cli,sarif
          output_file_path: results.sarif

  chart-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup base software
        uses: ./.github/actions/setup

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0

      - name: Check cluster
        run: |
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl get pvc -A
          kubectl get storageclass

      - name: Debug chart-testing
        run: |
          ct version
          which ct
          echo "CT_CONFIG_DIR=$CT_CONFIG_DIR"
          find "$CT_CONFIG_DIR" -type f -maxdepth 3 -print

      - name: Run chart-testing (install)
        run: |
          kubectl create ns misp
          ct install --debug --charts ./ --skip-clean-up --namespace misp

      - name: Debug cluster after failure
        if: failure()
        run: |
          kubectl get pods -n misp -o wide
          kubectl get pvc -n misp
          kubectl get statefulsets -n misp
          kubectl get deployments -n misp
          kubectl get events -n misp --sort-by=.lastTimestamp